<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/src/assets/origin-hub-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>Origin-Hub — Where all your needs connect</title>
    <meta name="description" content="Origin-Hub is where all your needs connect. A luminous, unified hub for every tool, contact, and workflow." />
    <meta name="author" content="Origin-Hub" />
    <meta property="og:title" content="Origin-Hub — Where all your needs connect" />
    <meta property="og:description" content="A unified, beautiful hub for everything you do." />
    <meta property="og:type" content="website" />
    <script>
      (function() {
        try {
          const stored = localStorage.getItem('theme');
          const isDark = stored === 'dark' || (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
